
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-v1
  template:
    metadata:
      labels:
        app: todo-v1
    spec:
      containers:
        - name: todo-app
          image: praneeth2006racham/todo-app:v1
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: todo-v1-service
spec:
  selector:
    app: todo-v1
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
