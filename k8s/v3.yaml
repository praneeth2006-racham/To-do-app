
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-v3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-v3
  template:
    metadata:
      labels:
        app: todo-v3
    spec:
      containers:
        - name: todo-app
          image: praneeth2006racham/todo-app:v3
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: todo-v3-service
spec:
  selector:
    app: todo-v3
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
